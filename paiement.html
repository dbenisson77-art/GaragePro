<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GaragePro - Paiement de l'abonnement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 450px;">
        <h3 class="text-center mb-3">Renouvellement GaragePro</h3>
        <p class="text-center text-muted">Garage : <strong>{{ garage.nom }}</strong></p>
        <div class="alert alert-info text-center">
            Montant à payer : <strong>10 000 FCFA / mois</strong>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Choisissez votre mode de paiement</label>
                <select name="methode" class="form-select" required>
                    <option value="Mobile Money (T-Money / Moov)">Mobile Money (T-Money / Moov / Orange)</option>
                    <option value="Carte Bancaire">Carte Bancaire</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Numéro de téléphone ou de carte</label>
                <input type="text" class="form-control" placeholder="Ex: +228 90000000" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">Payer et activer l'abonnement</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-secondary">Retour au tableau de bord</a>
        </div>
    </div>
</body>
</html>
